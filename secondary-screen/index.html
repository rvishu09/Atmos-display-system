<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bay Display</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="secondary-screen">

    <!-- ORDER ID - TOP RIGHT -->
    <div class="order-id-box">
        <span>ORDER ID</span>
        <strong id="orderId">-</strong>
    </div>


    <!-- BAY NUMBER -->
    <main class="display-content">

        <div class="bay-label">
            BAY
        </div>

        <div
            id="bayNo"
            class="bay-number"
        >
            ---
        </div>


        <!-- QR CODE -->
        <div
            id="qrcode"
            class="qr-code"
        ></div>


        <!-- QR DATA -->
        <div class="qr-data-label">
            QR DATA
        </div>

        <div
            id="qrData"
            class="qr-data"
        >
            -
        </div>

    </main>


    <!-- CONNECTION STATUS -->
    <div
        id="connection"
        class="connection"
    >
        ● WAITING
    </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="app.js"></script>

</body>
</html>
